<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stocks — Live View</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="stock-body">
  <header>
    <div class="header-inner">
      <div>
        <h1>Stocks</h1>
        <p class="subtitle">Tesla plus a few more watchlist names</p>
      </div>
      <div class="header-actions">
        <a class="button-link header-button" href="index.html">Back to market</a>
        <button id="refresh-stock-btn" type="button">
          <span id="refresh-stock-icon">↺</span> Refresh
        </button>
      </div>
    </div>
  </header>

  <main class="stocks-main">
    <section class="stocks-section">
      <div class="section-head stock-page-head">
        <h2>Watchlist</h2>
        <p>Compact cards with price, change, and next report date.</p>
      </div>
      <div class="stocks-grid" id="stocks-grid">
        <div class="stock-card skeleton-card"></div>
        <div class="stock-card skeleton-card"></div>
        <div class="stock-card skeleton-card"></div>
        <div class="stock-card skeleton-card"></div>
      </div>
    </section>

    <p class="stock-note" id="stock-note"></p>
  </main>

  <script src="stock.js"></script>
</body>
</html>
